---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title | escape }}</h1>
    <time class="meta" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%b %-d, %Y" }}</time>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  <p class="back"><a href="{{ '/' | relative_url }}">&larr; all posts</a></p>
</article>
