<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#F8F6F1">
  <title>her75</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Caveat:wght@400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:     #F8F6F1;
      --surf:   #FFFFFF;
      --surf2:  #F2EDE4;
      --text:   #1E1B18;
      --muted:  #9A9088;
      --acc:    #B8936A;
      --acc-lt: #EDE0CC;
      --border: #E8E0D4;
      --r:      14px;
      --r-lg:   22px;
    }

    *, *::before, *::after {
      box-sizing: border-box; margin: 0; padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body { height: 100%; overflow: hidden; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg); color: var(--text);
      max-width: 430px; margin: 0 auto;
      display: flex; flex-direction: column;
    }

    /* ─── LOADER ─── */
    #loader {
      position: fixed; inset: 0; z-index: 300;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
    }
    .loader-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 48px; font-weight: 300; font-style: italic;
      letter-spacing: -1px; opacity: 0;
      animation: fadeIn .6s ease .1s both;
    }
    @keyframes fadeIn { to { opacity: 1; } }

    /* ─── SETUP ─── */
    #setup {
      position: fixed; inset: 0; z-index: 200;
      background: var(--bg);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 40px 32px;
    }

    .setup-brand {
      font-family: 'Cormorant Garamond', serif;
      font-size: 60px; font-weight: 300; font-style: italic;
      letter-spacing: -1.5px; margin-bottom: 4px;
    }
    .setup-sub {
      font-family: 'Caveat', cursive;
      font-size: 17px; color: var(--muted); margin-bottom: 52px;
    }
    .setup-sub::before { content: '♡ '; color: var(--acc); }
    .setup-sub::after  { content: ' ♡'; color: var(--acc); }

    .field { width: 100%; margin-bottom: 16px; }
    .field label {
      display: block; font-size: 10px; letter-spacing: 2.5px;
      text-transform: uppercase; color: var(--muted); margin-bottom: 8px;
    }
    .field input {
      width: 100%; padding: 15px 18px;
      border: 1.5px solid var(--border); border-radius: var(--r);
      background: var(--surf);
      font-family: 'Inter', sans-serif; font-size: 15px; color: var(--text);
      outline: none; transition: border-color 0.2s;
      -webkit-appearance: none; appearance: none;
    }
    .field input:focus { border-color: var(--acc); }

    .btn-start {
      width: 100%; padding: 17px; margin-top: 8px;
      background: var(--text); color: #fff; border: none;
      border-radius: var(--r);
      font-family: 'Inter', sans-serif; font-size: 12px;
      letter-spacing: 2.5px; text-transform: uppercase; cursor: pointer;
      transition: opacity .15s;
    }
    .btn-start:active { opacity: .75; }

    /* ─── SCREENS ─── */
    .screen {
      display: none; flex: 1;
      overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding-bottom: 108px;
    }
    .screen.active { display: block; }

    /* ─── HEADER ─── */
    .hdr {
      padding: 56px 24px 16px;
      display: flex; justify-content: space-between; align-items: flex-end;
    }
    .logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 30px; font-weight: 300; font-style: italic;
    }
    .hdr-meta { text-align: right; }
    .hdr-date { font-size: 12px; color: var(--muted); }
    .hdr-name { font-family: 'Caveat', cursive; font-size: 15px; color: var(--acc); margin-top: 2px; }

    /* ─── HERO ─── */
    .hero { padding: 16px 24px 6px; }
    .hero-num {
      font-family: 'Cormorant Garamond', serif;
      font-size: 90px; font-weight: 300; line-height: 1; letter-spacing: -3px;
    }
    .hero-of {
      display: inline-block; font-size: 26px; font-weight: 300;
      color: var(--muted); vertical-align: super; margin-left: 6px; letter-spacing: 0;
    }
    .hero-sub { font-family: 'Caveat', cursive; font-size: 17px; color: var(--muted); margin-top: 2px; }

    /* ─── PROGRESS ─── */
    .prog-wrap { margin: 18px 24px 28px; height: 2px; background: var(--border); border-radius: 1px; }
    .prog-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--acc-lt), var(--acc));
      border-radius: 1px; transition: width .9s cubic-bezier(.4,0,.2,1);
    }

    /* ─── SECTION LABEL ─── */
    .sec {
      padding: 0 24px; margin-bottom: 14px;
      font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--muted);
    }

    /* ─── TASKS ─── */
    .tasks { padding: 0 16px; display: flex; flex-direction: column; gap: 10px; }

    .task {
      background: var(--surf); border: 1.5px solid var(--border);
      border-radius: var(--r); padding: 18px 20px;
      display: flex; align-items: center; gap: 16px;
      cursor: pointer; user-select: none;
      transition: background .25s, border-color .25s, transform .1s;
    }
    .task:active { transform: scale(0.985); }
    .task.done { background: var(--acc-lt); border-color: transparent; }

    .chk {
      width: 24px; height: 24px; border-radius: 50%;
      border: 1.5px solid var(--border); background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: all .25s;
    }
    .task.done .chk { background: var(--acc); border-color: var(--acc); }
    .chk svg { opacity: 0; transform: scale(.5); transition: all .2s; }
    .task.done .chk svg { opacity: 1; transform: scale(1); }

    .task-body { flex: 1; min-width: 0; }
    .task-name { font-size: 15px; font-weight: 400; transition: color .25s; }
    .task.done .task-name {
      color: var(--muted); text-decoration: line-through; text-decoration-color: var(--acc);
    }
    .task-hint { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .task-icon { font-size: 20px; flex-shrink: 0; }

    /* ─── ALL DONE ─── */
    .done-card {
      margin: 24px 16px 0;
      background: var(--text); border-radius: var(--r-lg);
      padding: 30px 24px; text-align: center; color: #fff; display: none;
    }
    .done-card.show { display: block; animation: pop .3s ease both; }
    .done-deco { font-family: 'Caveat', cursive; font-size: 22px; color: var(--acc); margin-bottom: 8px; }
    .done-card h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 38px; font-weight: 300; font-style: italic; margin-bottom: 6px;
    }
    .done-card p { font-size: 13px; opacity: .5; letter-spacing: .3px; }

    /* ─── QUOTE ─── */
    .quote { margin: 24px 16px 0; padding: 22px 24px; background: var(--surf2); border-radius: var(--r-lg); }
    .quote-body {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px; font-style: italic; font-weight: 300; line-height: 1.55;
    }
    .quote-attr { font-family: 'Caveat', cursive; font-size: 14px; color: var(--muted); margin-top: 12px; }
    .quote-attr::before { content: '✦ '; color: var(--acc); }

    /* ─── CALENDAR ─── */
    .stats-row {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 10px; padding: 0 16px; margin-bottom: 24px;
    }
    .stat-card {
      background: var(--surf); border: 1.5px solid var(--border);
      border-radius: var(--r); padding: 16px 10px; text-align: center;
    }
    .stat-n { font-family: 'Cormorant Garamond', serif; font-size: 34px; font-weight: 300; line-height: 1; }
    .stat-l { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-top: 4px; }

    .cal-grid { padding: 0 16px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
    .cell {
      aspect-ratio: 1; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; position: relative;
      border: 1.5px solid var(--border); background: var(--surf); color: var(--muted);
    }
    .cell.today { border-color: var(--acc); color: var(--acc); font-weight: 500; }
    .cell.won   { background: var(--acc-lt); border-color: transparent; color: var(--acc); }
    .cell.won::after { content: '✓'; position: absolute; bottom: 4px; font-size: 8px; color: var(--acc); }
    .cell.missed { background: #F8EDED; border-color: transparent; color: #C4A0A0; }
    .cell.future { opacity: .22; }

    /* ─── BOTTOM NAV ─── */
    .nav {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 430px;
      background: rgba(248,246,241,.9);
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      border-top: 1px solid var(--border);
      display: flex; padding: 10px 0 32px;
    }
    .nav-btn {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      gap: 5px; padding: 6px 0; cursor: pointer; color: var(--muted);
      transition: color .2s; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase;
    }
    .nav-btn.active { color: var(--text); }
    .nav-btn svg { width: 22px; height: 22px; }

    /* ─── SAVE INDICATOR ─── */
    .save-dot {
      position: fixed; top: 16px; right: 16px; z-index: 100;
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--acc); opacity: 0; transition: opacity .3s;
    }
    .save-dot.saving { opacity: 1; }

    /* ─── CHALLENGE PICKER ─── */
    .ch-grid {
      width: 100%; display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 8px; margin-bottom: 20px;
    }
    .ch-card {
      border: 1.5px solid var(--border); border-radius: var(--r);
      padding: 14px 8px; text-align: center; cursor: pointer;
      background: var(--surf); transition: all .2s;
    }
    .ch-card.sel { border-color: var(--acc); background: var(--acc-lt); }
    .ch-name {
      display: block;
      font-family: 'Cormorant Garamond', serif;
      font-size: 18px; font-weight: 400; font-style: italic; margin-bottom: 3px;
    }
    .ch-tag { font-family: 'Caveat', cursive; font-size: 11px; color: var(--muted); }
    .ch-card.sel .ch-tag { color: var(--acc); }

    /* ─── RESET BANNER ─── */
    .reset-banner {
      margin: 0 16px 4px;
      background: #2A1A10; border-radius: var(--r);
      padding: 16px 20px;
      display: flex; align-items: center; gap: 14px;
      color: #fff; animation: fadeUp .4s ease both;
    }
    .reset-icon { font-size: 26px; flex-shrink: 0; opacity: .8; }
    .reset-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 20px; font-weight: 300; font-style: italic;
    }
    .reset-sub { font-size: 12px; opacity: .45; margin-top: 2px; letter-spacing: .2px; }

    /* ─── UTILS ─── */
    .hidden { display: none !important; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .task { animation: fadeUp .35s ease both; }
    .task:nth-child(1) { animation-delay: .00s; }
    .task:nth-child(2) { animation-delay: .06s; }
    .task:nth-child(3) { animation-delay: .12s; }
    .task:nth-child(4) { animation-delay: .18s; }
    .task:nth-child(5) { animation-delay: .24s; }
    .task:nth-child(6) { animation-delay: .30s; }

    @keyframes pop {
      from { transform: scale(.92); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }
  </style>
</head>
<body>

<div id="loader"><div class="loader-logo">her75</div></div>

<div class="save-dot" id="save-dot"></div>

<!-- ── SETUP ── -->
<div id="setup" class="hidden">
  <div class="setup-brand">her75</div>
  <div class="setup-sub" id="setup-sub">your soft era starts now</div>
  <div class="field">
    <label>your name</label>
    <input type="text" id="inp-name" placeholder="Aoi" autocomplete="off" autocorrect="off" autocapitalize="words">
  </div>
  <div class="field">
    <label>start date</label>
    <input type="date" id="inp-date">
  </div>
  <div class="field">
    <label>choose your challenge</label>
    <div class="ch-grid">
      <div class="ch-card sel" id="ch-soft" onclick="pickChallenge('soft')">
        <span class="ch-name">soft</span>
        <span class="ch-tag">gentle flow</span>
      </div>
      <div class="ch-card" id="ch-medium" onclick="pickChallenge('medium')">
        <span class="ch-name">medium</span>
        <span class="ch-tag">level up</span>
      </div>
      <div class="ch-card" id="ch-hard" onclick="pickChallenge('hard')">
        <span class="ch-name">hard</span>
        <span class="ch-tag">no excuses</span>
      </div>
    </div>
  </div>
  <button class="btn-start" onclick="begin()">begin my journey ♡</button>
</div>

<!-- ── TODAY ── -->
<div class="screen active" id="s-today">
  <div class="hdr">
    <div class="logo">her75</div>
    <div class="hdr-meta">
      <div class="hdr-date" id="hdr-date"></div>
      <div class="hdr-name" id="hdr-name"></div>
    </div>
  </div>
  <div class="hero">
    <div class="hero-num" id="hero-num">1<span class="hero-of">/ 75</span></div>
    <div class="hero-sub" id="hero-sub">day one ♡</div>
  </div>
  <div class="reset-banner hidden" id="reset-banner">
    <div class="reset-icon">↺</div>
    <div>
      <div class="reset-title">fresh start</div>
      <div class="reset-sub">you missed a day · back to day 1</div>
    </div>
  </div>

  <div class="prog-wrap"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
  <div class="sec">today's rituals</div>
  <div class="tasks" id="task-list"></div>
  <div class="done-card" id="done-card">
    <div class="done-deco">✦ ✦ ✦</div>
    <h2>day complete</h2>
    <p>you showed up for yourself today</p>
  </div>
  <div class="quote">
    <div class="quote-body" id="quote-text"></div>
    <div class="quote-attr">daily reminder</div>
  </div>
</div>

<!-- ── JOURNEY ── -->
<div class="screen" id="s-journey">
  <div class="hdr">
    <div class="logo">75 days</div>
    <div class="hdr-meta"><div class="hdr-date" id="cal-info"></div></div>
  </div>
  <div class="stats-row" id="stats-row"></div>
  <div class="sec">your journey</div>
  <div class="cal-grid" id="cal-grid"></div>
</div>

<!-- ── NAV ── -->
<div class="nav">
  <div class="nav-btn active" id="nav-today" onclick="go('today')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>
    </svg>
    today
  </div>
  <div class="nav-btn" id="nav-journey" onclick="go('journey')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <rect x="3" y="4" width="18" height="18" rx="2"/>
      <path d="M16 2v4M8 2v4M3 10h18"/>
    </svg>
    journey
  </div>
</div>

<script>
// ── CONFIG ─────────────────────────────────────────────────────────────────
// Fill in your Firebase Realtime Database URL (e.g. https://your-app-default-rtdb.firebaseio.com)
// Then share the link as: https://schmxtz.github.io/her75/?key=some-secret-key
const FIREBASE_URL = 'https://her75-e7a66-default-rtdb.firebaseio.com';
// ───────────────────────────────────────────────────────────────────────────

const CHALLENGES = {
  soft: {
    tagline: 'your soft era starts now',
    tasks: [
      { id: 'water',   name: 'hydrate',  hint: 'drink 2-3L of water',        icon: '💧' },
      { id: 'workout', name: 'move',     hint: '45 min workout',              icon: '🏋️' },
      { id: 'steps',   name: '8k steps', hint: 'walk at least 8,000 steps',  icon: '👟' },
      { id: 'read',    name: 'read',     hint: '20 minutes · any book',       icon: '📖' },
      { id: 'nourish', name: 'nourish',  hint: '3 balanced meals, no junk',  icon: '🥗' },
      { id: 'journal', name: 'journal',  hint: 'write one entry',             icon: '📓' },
    ],
  },
  medium: {
    tagline: 'level up, glow up',
    tasks: [
      { id: 'water',   name: 'hydrate',       hint: 'drink 3L of water',              icon: '💧' },
      { id: 'workout', name: 'move',          hint: '45 min workout',                 icon: '🏋️' },
      { id: 'steps',   name: '10k steps',     hint: 'walk at least 10,000 steps',     icon: '👟' },
      { id: 'read',    name: 'read',          hint: '10 pages · any book',            icon: '📖' },
      { id: 'nourish', name: 'eat clean',     hint: 'follow your diet, no cheat meals', icon: '🥗' },
      { id: 'photo',   name: 'progress pic',  hint: 'take your daily photo',          icon: '📸' },
    ],
  },
  hard: {
    tagline: 'no excuses. just results.',
    tasks: [
      { id: 'water',    name: 'hydrate',      hint: 'drink 1 gallon (3.8L)',           icon: '💧' },
      { id: 'workout1', name: 'workout 1',    hint: '45 min · any location',           icon: '🏋️' },
      { id: 'workout2', name: 'workout 2',    hint: '45 min · must be outdoors',       icon: '🏃‍♀️' },
      { id: 'read',     name: 'read',         hint: '10 pages · non-fiction only',     icon: '📖' },
      { id: 'diet',     name: 'diet',         hint: 'zero cheat meals, no alcohol',    icon: '🥗' },
      { id: 'photo',    name: 'progress pic', hint: 'take your daily photo',           icon: '📸' },
    ],
  },
};

let selectedChallenge = 'soft';

function pickChallenge(key) {
  selectedChallenge = key;
  document.querySelectorAll('.ch-card').forEach(c => c.classList.remove('sel'));
  document.getElementById('ch-' + key).classList.add('sel');
  const subs = { soft: 'your soft era starts now', medium: 'level up, glow up', hard: 'no excuses. just results.' };
  document.getElementById('setup-sub').textContent = subs[key];
}

const QUOTES = [
  'Discipline is the highest form of self-love.',
  'She is not waiting to be discovered. She is building herself.',
  'Progress, not perfection.',
  'Your future self is watching you right now.',
  'Small steps every day lead to extraordinary results.',
  'Consistency is the new motivation.',
  'Be the girl you needed when you were younger.',
  'Strong is beautiful. So is rest.',
  'She believed she could, so she did.',
  'romanticize your life — starting today.',
  'You are your own biggest investment.',
  'Wake up early. Change your life.',
  'Discipline > motivation. Always.',
  'read, grow, glow ✦',
  'strong body, strong mind.',
  'You don\'t need motivation. You need a routine.',
  'The version of you that you want to be is already inside you.',
  'Eat well. Move daily. Sleep deeply. Repeat.',
  'She is fierce. She is soft. She is both.',
  'Your habits are your future.',
  'Comfort zones are beautiful, but nothing grows there.',
  'Do it for the woman you\'re becoming.',
  'Rest if you must, but don\'t you quit.',
  'Nourish to flourish.',
  'Today\'s effort is tomorrow\'s result.',
  'You are not behind. You are exactly where you need to be.',
  'Make yourself proud.',
  'Good things take time. Great things take consistency.',
  'The work you do in private shows up in public.',
  'She took care of her body and her body took care of her.',
  'Every rep, every page, every glass of water counts.',
  'You\'ve done hard things before. This is one of them.',
  'A little progress each day adds up to big results.',
  'Fall in love with taking care of yourself.',
  'Your energy is sacred. Protect it.',
  'Start before you\'re ready. Grow as you go.',
  'Be patient. You\'re growing.',
  'Dream big. Start small. Show up daily.',
  'The secret is: there is no secret. Just show up.',
  'She chose herself — every single day.',
];

// ── Storage (Firebase via REST, or localStorage fallback) ──────────────────
const urlKey = new URLSearchParams(window.location.search).get('key');
const useFirebase = !!(urlKey && FIREBASE_URL && !FIREBASE_URL.startsWith('REPLACE'));

let D = {};
let _saveTimer = null;
const saveDot = document.getElementById('save-dot');

function fbUrl() {
  return `${FIREBASE_URL}/her75/${encodeURIComponent(urlKey)}.json`;
}

async function loadData() {
  if (useFirebase) {
    const r = await fetch(fbUrl());
    D = (await r.json()) || {};
  } else {
    try { D = JSON.parse(localStorage.getItem('her75') || '{}'); } catch { D = {}; }
  }
}

function saveData() {
  if (useFirebase) {
    clearTimeout(_saveTimer);
    saveDot.classList.add('saving');
    _saveTimer = setTimeout(() => {
      fetch(fbUrl(), { method: 'PUT', body: JSON.stringify(D) })
        .finally(() => saveDot.classList.remove('saving'));
    }, 500);
  } else {
    localStorage.setItem('her75', JSON.stringify(D));
  }
}
// ───────────────────────────────────────────────────────────────────────────

const todayKey = () => new Date().toISOString().slice(0, 10);

function getEffectiveStart() {
  if ((D.challenge || 'soft') !== 'hard') return D.start;
  const r = D.restarts;
  return (r && r.length) ? r[r.length - 1] : D.start;
}

function checkHardReset() {
  if ((D.challenge || 'soft') !== 'hard') return;

  const yesterday = new Date();
  yesterday.setDate(yesterday.getDate() - 1);
  const yKey = yesterday.toISOString().slice(0, 10);
  const effectiveStart = getEffectiveStart();

  // Only check days within the current run
  if (yKey < effectiveStart) return;

  // If yesterday wasn't completed → reset
  if (!D.days?.[yKey]?.__done) {
    D.restarts = D.restarts || [];
    const today = todayKey();
    // Avoid duplicate entries for the same day
    if (D.restarts[D.restarts.length - 1] !== today) {
      D.restarts.push(today);
      saveData();
    }
  }
}

function dayNum() {
  if (!D.start) return 1;
  const diff = Math.floor((new Date(todayKey()) - new Date(getEffectiveStart())) / 86400000);
  return Math.max(1, Math.min(diff + 1, 75));
}

function todayTasks() {
  const k = todayKey();
  D.days = D.days || {};
  D.days[k] = D.days[k] || {};
  return D.days[k];
}

async function begin() {
  const name = document.getElementById('inp-name').value.trim() || 'you';
  const date = document.getElementById('inp-date').value;
  if (!date) { document.getElementById('inp-date').focus(); return; }
  D = { name, start: date, challenge: selectedChallenge, days: {} };
  saveData();
  document.getElementById('setup').classList.add('hidden');
  render();
}

function go(screen) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('s-' + screen).classList.add('active');
  document.getElementById('nav-' + screen).classList.add('active');
  if (screen === 'journey') renderCalendar();
}

function toggle(id) {
  const t = todayTasks();
  t[id] = !t[id];
  saveData();
  renderTasks();
}

function getTasks() {
  return CHALLENGES[D.challenge || 'soft'].tasks;
}

function renderTasks() {
  const tasks = getTasks();
  const t = todayTasks();
  const list = document.getElementById('task-list');
  list.innerHTML = '';
  tasks.forEach(task => {
    const done = !!t[task.id];
    const el = document.createElement('div');
    el.className = 'task' + (done ? ' done' : '');
    el.innerHTML = `
      <div class="chk">
        <svg width="11" height="11" viewBox="0 0 11 11" fill="none">
          <path d="M1.5 5.5 4.5 8.5 9.5 2.5" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="task-body">
        <div class="task-name">${task.name}</div>
        <div class="task-hint">${task.hint}</div>
      </div>
      <div class="task-icon">${task.icon}</div>`;
    el.addEventListener('click', () => toggle(task.id));
    list.appendChild(el);
  });

  const allDone = tasks.every(task => !!t[task.id]);
  const card = document.getElementById('done-card');
  if (allDone) {
    card.classList.add('show');
    D.days[todayKey()].__done = true;
    saveData();
  } else {
    card.classList.remove('show');
  }
}

function renderCalendar() {
  const grid = document.getElementById('cal-grid');
  const stats = document.getElementById('stats-row');
  grid.innerHTML = '';
  stats.innerHTML = '';

  const start = new Date(getEffectiveStart());
  const today = todayKey();
  const day = dayNum();
  let won = 0;

  for (let i = 0; i < 75; i++) {
    const d = new Date(start);
    d.setDate(d.getDate() + i);
    const key = d.toISOString().slice(0, 10);
    const el = document.createElement('div');
    el.className = 'cell';
    el.textContent = i + 1;
    if (key === today)            { el.classList.add('today'); }
    else if (key < today) {
      if (D.days?.[key]?.__done) { el.classList.add('won'); won++; }
      else                        { el.classList.add('missed'); }
    } else                        { el.classList.add('future'); }
    grid.appendChild(el);
  }

  const past = day - 1;
  const winRate = past > 0 ? Math.round((won / past) * 100) : 0;
  document.getElementById('cal-info').textContent = `${won} days won`;

  [
    { n: won, l: 'completed' },
    { n: winRate + '%', l: 'win rate' },
    { n: Math.max(0, 75 - day + 1), l: 'remaining' },
  ].forEach(s => {
    const c = document.createElement('div');
    c.className = 'stat-card';
    c.innerHTML = `<div class="stat-n">${s.n}</div><div class="stat-l">${s.l}</div>`;
    stats.appendChild(c);
  });
}

function render() {
  if (!D.start) {
    document.getElementById('setup').classList.remove('hidden');
    return;
  }
  document.getElementById('setup').classList.add('hidden');

  const day = dayNum();
  const names = ['', 'one', 'two', 'three', 'four', 'five'];
  const challenge = D.challenge || 'soft';
  document.getElementById('hero-num').innerHTML = `${day}<span class="hero-of">/ 75</span>`;
  document.getElementById('hero-sub').textContent =
    day <= 5 ? `day ${names[day]} · 75 ${challenge} ♡` : `day ${day} of 75 · ${challenge}`;
  document.getElementById('prog-fill').style.width = ((day - 1) / 75 * 100) + '%';

  const now = new Date();
  document.getElementById('hdr-date').textContent =
    now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
  document.getElementById('hdr-name').textContent = `hi, ${D.name} ♡`;
  document.getElementById('quote-text').textContent = `"${QUOTES[day % QUOTES.length]}"`;

  const justReset = challenge === 'hard' && (D.restarts || []).includes(todayKey());
  document.getElementById('reset-banner').classList.toggle('hidden', !justReset);

  renderTasks();
}

// ── Init ───────────────────────────────────────────────────────────────────
(async () => {
  document.getElementById('inp-date').value = todayKey();
  try { await loadData(); } catch { D = {}; }
  checkHardReset();
  document.getElementById('loader').classList.add('hidden');
  render();
})();
</script>
</body>
</html>
